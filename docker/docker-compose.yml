services:
  postgres:
    image: postgres:16
    ports: ["5434:5432"]
    environment:
      POSTGRES_USER: cdt
      POSTGRES_PASSWORD: cdt
      POSTGRES_DB: cdt
    volumes: [cdt_pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdt -d cdt"]
      interval: 3s
      timeout: 5s
      retries: 10

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.1.0
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

volumes:
  cdt_pg_data:
